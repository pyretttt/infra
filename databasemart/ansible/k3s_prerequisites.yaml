- name: Prepare node for k3s
  hosts: vps
  become: true
  tasks:
    - name: Load required kernel modules
      modprobe:
        name: "{{ item }}"
        state: present
      loop: [overlay, br_netfilter]

    - name: Persist modules across reboot
      copy:
        dest: /etc/modules-load.d/k3s.conf
        content: |
          overlay
          br_netfilter

    - name: Set required sysctl params
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_set: yes
        state: present
        reload: yes
      loop:
        - { name: net.bridge.bridge-nf-call-iptables, value: "1" }
        - { name: net.ipv4.ip_forward, value: "1" }
        - { name: net.bridge.bridge-nf-call-ip6tables, value: "1" }

    - name: Disable swap now
      command: swapoff -a
      when: ansible_facts['swaptotal_mb'] | int > 0

    # Ubuntu swap can be fstab, /swap.img, and a generated systemd unit
    - name: Comment swap entries in fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#\s].*\sswap\s.*)$'
        replace: '# \1'

    - name: Collect systemd swap units
      command: systemctl list-unit-files --type=swap --no-legend --plain
      register: swap_unit_files
      changed_when: false
      # systemd exits 1 when no swap units exist
      failed_when: swap_unit_files.rc > 1

    - name: Mask systemd swap units
      systemd:
        name: "{{ item.split()[0] }}"
        masked: true
        daemon_reload: true
      loop: "{{ swap_unit_files.stdout_lines }}"
      when: item | length > 0
