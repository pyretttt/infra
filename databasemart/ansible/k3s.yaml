- name: Install k3s
  hosts: vps
  become: true
  tasks:
    - name: Download k3s install script
      get_url:
        url: https://get.k3s.io
        dest: /tmp/install_k3s.sh
        mode: "0755"

    - name: Install k3s (server, single node)
      command: /tmp/install_k3s.sh
      args:
        creates: /usr/local/bin/k3s
      environment:
        INSTALL_K3S_EXEC: "server --write-kubeconfig-mode 644 --node-external-ip {{ public_ip | default(ansible_default_ipv4.address) }}"

    - name: Ensure k3s is started and enabled on boot
      systemd:
        name: k3s
        state: started
        enabled: true

    - name: Wait for kubeconfig
      wait_for:
        path: /etc/rancher/k3s/k3s.yaml
        timeout: 120

    - name: Download kubeconfig
      fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ playbook_dir }}/../.kube.config"
        flat: true
