[tools]
age = "latest"
flux2 = "latest"
helm = "latest"
k9s = "latest"
opentofu = "latest"
sops = "latest"
terraform = "latest"
# additionally openssl
# additionally ansible
# additionally htpasswd
# python3

[env]
KUBECONFIG = "databasemart/.kube.config"
VPS_IP = "69.30.204.214"
N8N_INSTANCE_OWNER_EMAIL = "bob@bobby.com"
N8N_INSTANCE_OWNER_FIRST_NAME = "bob"
N8N_INSTANCE_OWNER_LAST_NAME = "bobby"

[tasks."k9s"]
description = "runs k9s with provisioned cluster config"
run = """
if [ -f "${KUBECONFIG}" ]; then
    k9s --kubeconfig ${KUBECONFIG}
else
    echo "${KUBECONFIG} file does not exist"
    exit 1
fi
"""

[tasks."generate-kube-config"]
description = "Regenerated kube.config file"
dir = "tf"
run = """
terraform apply -replace=null_resource.kube_config
"""

[tasks."generate-wg-keys"]
description = "Generate wireguard client and server key pairs"
run = """
OPENSSL=$(brew --prefix openssl)/bin/openssl
gen_wg_keypair() {
  pem=$("$OPENSSL" genpkey -algorithm X25519)
  priv=$(printf '%s\n' "$pem" | "$OPENSSL" pkey -outform DER | tail -c 32 | base64)
  pub=$(printf '%s\n' "$pem" | "$OPENSSL" pkey -pubout -outform DER | tail -c 32 | base64)
  printf '%s %s\n' "$priv" "$pub"
}
set -- $(gen_wg_keypair)
SERVER_PRIV=$1
SERVER_PUB=$2
set -- $(gen_wg_keypair)
CLIENT_PRIV=$1
CLIENT_PUB=$2
printf 'SERVER_PRIV=%s\nSERVER_PUB=%s\nCLIENT_PRIV=%s\nCLIENT_PUB=%s\n' \
  "$SERVER_PRIV" "$SERVER_PUB" "$CLIENT_PRIV" "$CLIENT_PUB" > .wg-keys.env
"""

[tasks."get-grafana-creds"]
description = "Outputs grafana credentials into stdin"
run = """
GRAFANA_USER=$(kubectl get secret grafana-admin -o jsonpath="{.data.admin-user}" | base64 -d)
GRAFANA_PASS=$(kubectl get secret grafana-admin -o jsonpath="{.data.admin-password}" | base64 -d)
echo "Username: ${GRAFANA_USER}"
echo "Password: ${GRAFANA_PASS}"
"""

[tasks."get-dagu-creds"]
description = "Outputs grafana credentials into stdin"
run = """
DAGU_USER=$(kubectl get secret dagu-basic-auth -o jsonpath="{.data.username}" | base64 -d)
DAGU_PASS=$(kubectl get secret dagu-basic-auth -o jsonpath="{.data.password}" | base64 -d)
echo "Username: ${DAGU_USER}"
echo "Password: ${DAGU_PASS}"
"""

# ============  Postgres  =============
[tasks."pq:get-postgres-creds"]
description = "Outputs postgres credentials into stdin"
run = """
POSTGRES_USER=$(kubectl get secret postgres-auth -n default -o jsonpath="{.data.username}" | base64 -d)
POSTGRES_PASS=$(kubectl get secret postgres-auth -n default -o jsonpath="{.data.postgres-password}" | base64 -d)
echo "Username: ${POSTGRES_USER}"
echo "Password: ${POSTGRES_PASS}"
echo "Host: postgres.default.svc.cluster.local"
echo "Port: 5432"
echo "Database: windmill"
"""

[tasks."pg:restore-postgres-db"]
description = "Restores postgres database from S3 storage files"
usage = '''
flag "--db <db>" help="Database to restore" {
  choices "n8n" "polywhale"
}
'''
run = """
JOB=$(sed -e 's|${DATABASE_NAME}|'"${usage_db}"'|g' manifests/postgres/backup-restore.yaml.tmpl)
echo "${JOB}" | kubectl apply -f -
"""

[tasks."pg:run-job"]
description = "Runs sql statements"
usage = '''
flag "--sql <sql>" help="SQL instructions" {
  required #true
}
flag "--db <db>" help="Database where instructions are executed" {
  required #true
}
'''
run = """
: "${usage_sql:?--sql is required}"
: "${usage_db:?--db is required}"
JOB_NAME="postgres-psql-$(date +%Y%m%d%H%M%S)-$(openssl rand -hex 3)"
PSQL_COMMAND_B64=$(printf '%s' "${usage_sql}" | openssl base64 -A)
JOB=$(sed \
  -e 's|${JOB_NAME}|'"${JOB_NAME}"'|g' \
  -e 's|${DATABASE_NAME}|'"${usage_db}"'|g' \
  -e 's|${PSQL_COMMAND_B64}|'"${PSQL_COMMAND_B64}"'|g' \
  manifests/postgres/psql-job.yaml.tmpl)
echo "${JOB}" | kubectl apply -f -
"""

[tasks."pg:create-json-table"]
description = "Creates pg json table"
usage = '''
flag "--sqlfile <file>" help="File with sql instructions" default="create_json_db.sql"
flag "--db <db>" help="Database where instructions are executed" {
  required #true
}
flag "--table <table>" help="Table to create" {
  required #true
}
'''
run = """
: "${usage_db:?--db is required}"
: "${usage_table:?--table is required}"
SQL=$(sed -e 's|${TABLE_NAME}|'"${usage_table}"'|g' "${usage_sqlfile}")
mise run pg:run-job --sql "${SQL}" --db "${usage_db}"
"""


# ============  Ansible  =============
[tasks."ansible:configure-all"]
description = "Runs full configuration of vps"
dir = "databasemart/ansible"
run = """
ansible-playbook -i inventory.yaml all.yaml -K
"""


# ============  Template Rendering  =============

[tasks."render:wg-config"]
description = "Renders wireguard configs"
run = """
if [ -f manifests/wg/wg-config.yaml ] && [ -f wg-client.yaml ]; then
    echo Wireguard Already configured - skip setup
    exit 0
fi

if [ -f ${KUBECONFIG} ]; then
    echo "Kubeconfig found"
else
    echo "Kubeconfig not found"
    exit 1
fi

mise run generate-wg-keys
set -a && source .wg-keys.env && set +a

sed -e 's|${SERVER_PRIV}|'"${SERVER_PRIV}"'|g' \
    -e 's|${CLIENT_PUB}|'"${CLIENT_PUB}"'|g' \
  manifests/wg/wg-config.yaml.tmpl > manifests/wg/wg-config.yaml

mise run age:encrypt --file manifests/wg/wg-config.yaml

INTERNAL_DNS_IP=$(kubectl --kubeconfig ${KUBECONFIG} get svc internal-coredns -n internal-dns -o jsonpath='{.spec.clusterIPs[0]}')
GATEWAY_IP=${VPS_IP}

sed -e 's|${CLIENT_PRIV}|'"${CLIENT_PRIV}"'|g' \
    -e 's|${SERVER_PUB}|'"${SERVER_PUB}"'|g' \
    -e 's|${INTERNAL_DNS_IP}|'"${INTERNAL_DNS_IP}"'|g' \
    -e 's|${GATEWAY_IP}|'"${GATEWAY_IP}"'|g' \
  wg-client.yaml.tmpl > wg-client.yaml

mise run age:encrypt --file wg-client.yaml

rm -f .wg-keys.env
"""


[tasks."render:public-ingress"]
description = "Renders public ingress with NLB IP"
run = """
NLB_IP=${VPS_IP}

sed -e 's|${NLB_IP}|'"${NLB_IP}"'|g' \
  manifests/ingress/public-ingress.yaml.tmpl > manifests/ingress/public-ingress.yaml
"""

[tasks."render:grafana-secret"]
description = "Renders grafana secret"
env.GRAFANA_USER = "{{ env.GRAFANA_USER | default(value='admin') }}"
env.GRAFANA_PASS = "{{ env.GRAFANA_PASS | default(value=exec(command='openssl rand -base64 16')) }}"

run = """
if [ -f manifests/kube-prom-stack/grafana-secret.yaml ]; then
  echo "Credentials already exists"
  exit 0
fi
sed -e 's|${GRAFANA_USER}|'"${GRAFANA_USER}"'|g' \
    -e 's|${GRAFANA_PASS}|'"${GRAFANA_PASS}"'|g' \
  manifests/kube-prom-stack/grafana-secret.yaml.tmpl > manifests/kube-prom-stack/grafana-secret.yaml

mise run age:encrypt --file manifests/kube-prom-stack/grafana-secret.yaml
"""

[tasks."render:dagu-secret"]
description = "Renders dagu secret"
env.DAGU_USER = "{{ env.DAGU_USER | default(value='admin') }}"
env.DAGU_PASS = "{{ env.DAGU_PASS | default(value=exec(command='openssl rand -base64 16')) }}"

run = """
if [ -f manifests/workflow/dagu/dagu-secret.yaml ]; then
  echo "Credentials already exists"
  exit 0
fi
sed -e 's|${DAGU_USER}|'"${DAGU_USER}"'|g' \
    -e 's|${DAGU_PASS}|'"${DAGU_PASS}"'|g' \
  manifests/workflow/dagu/dagu-secret.yaml.tmpl > manifests/workflow/dagu/dagu-secret.yaml

mise run age:encrypt --file manifests/workflow/dagu/dagu-secret.yaml
"""

[tasks."render:n8n-secret"]
description = "Renders n8n secret"
env.N8N_ENCRYPTION_KEY = "{{ env.N8N_ENCRYPTION_KEY | default(value=exec(command='openssl rand -hex 32')) }}"
env.PASSWORD = { required = true }

run = """
if [ -f manifests/workflow/n8n/n8n-secret.yaml ]; then
  echo "Secret already exists"
  exit 0
fi

N8N_INSTANCE_OWNER_PASSWORD_HASH=$(htpasswd -bnBC 12 "" "${PASSWORD}" | tr -d ':\n')

sed -e 's|${N8N_ENCRYPTION_KEY}|'"${N8N_ENCRYPTION_KEY}"'|g' \
    -e 's|${N8N_INSTANCE_OWNER_EMAIL}|'"${N8N_INSTANCE_OWNER_EMAIL}"'|g' \
    -e 's|${N8N_INSTANCE_OWNER_FIRST_NAME}|'"${N8N_INSTANCE_OWNER_FIRST_NAME}"'|g' \
    -e 's|${N8N_INSTANCE_OWNER_LAST_NAME}|'"${N8N_INSTANCE_OWNER_LAST_NAME}"'|g' \
    -e 's|${N8N_INSTANCE_OWNER_PASSWORD_HASH}|'"${N8N_INSTANCE_OWNER_PASSWORD_HASH}"'|g' \
  manifests/workflow/n8n/n8n-secret.yaml.tmpl > manifests/workflow/n8n/n8n-secret.yaml

mise run age:encrypt --file manifests/workflow/n8n/n8n-secret.yaml
"""

[tasks."render:postgres-secret"]
description = "Renders postgres secret"
env.POSTGRES_USER = "{{ env.POSTGRES_USER | default(value='user') }}"
env.POSTGRES_USER_PASSWORD = "{{ env.POSTGRES_PASSWORD | default(value=exec(command='openssl rand -base64 16')) }}"
env.POSTGRES_ADMIN_PASSWORD = "{{ env.POSTGRES_ADMIN_PASSWORD | default(value=exec(command='openssl rand -base64 16')) }}"
run = """
sed -e 's|${POSTGRES_USER}|'"${POSTGRES_USER}"'|g' \
  manifests/postgres/postgres-user.yaml.tmpl > manifests/postgres/postgres-user.yaml

if [ -f manifests/postgres/postgres-secret.yaml ]; then
  echo "Credentials already exists"
  exit 0
fi
sed -e 's|${POSTGRES_USER}|'"${POSTGRES_USER}"'|g' \
    -e 's|${POSTGRES_USER_PASSWORD}|'"${POSTGRES_USER_PASSWORD}"'|g' \
    -e 's|${POSTGRES_ADMIN_PASSWORD}|'"${POSTGRES_ADMIN_PASSWORD}"'|g' \
  manifests/postgres/postgres-secret.yaml.tmpl > manifests/postgres/postgres-secret.yaml

mise run age:encrypt --file manifests/postgres/postgres-secret.yaml
"""

[tasks."render:s3-rclone-secret"]
description = "Renders s3-rclone secret for backup management"
env.S3_RCLONE_CONFIG = "{{ env.S3_RCLONE_CONFIG | default(value='${HOME}/.config/rclone/rclone.conf') }}"
run = """
if [ -f manifests/s3_rclone_config.yaml ]; then
  echo "Secret already exists"
  exit 0
fi

python3 - <<'PY'
import os
from pathlib import Path

raw_path = os.environ["S3_RCLONE_CONFIG"]
config_path = Path(os.path.expanduser(os.path.expandvars(raw_path)))
if not config_path.is_file():
    raise SystemExit(f"rclone config not found at {config_path}")

contents = config_path.read_text()
if not contents.strip():
    raise SystemExit(f"rclone config is empty: {config_path}")

tmpl = Path("manifests/s3_rclone_config.yaml.tmpl").read_text()
indent = "    "
replacement = ("\\n" + indent).join(contents.splitlines())
Path("manifests/s3_rclone_config.yaml").write_text(
    tmpl.replace("${S3_RCLONE_CONFIG}", replacement)
)
print(f"Rendered secret from {config_path}")
PY

mise run age:encrypt --file manifests/s3_rclone_config.yaml
"""

[tasks."render:all"]
description = "Renders all templates"
run = [
    { task = "render:public-ingress" },
    { task = "render:wg-config" },
    { task = "render:grafana-secret" },
    { task = "render:dagu-secret" },
    { task = "render:n8n-secret" },
    { task = "render:postgres-secret" },
    { task = "render:s3-rclone-secret" },
]

# ============  Flux  =============

[tasks."flux:bootstrap"]
env.GITHUB_TOKEN = { required = "Github token required for fluxcd setup" }
env.GITHUB_USER  = { required = "Github username required for fluxcd setup" }
description = "Fluxcd configuration to reconcil this repo definitions from provisioned cluster"
run = """
flux bootstrap github \
  --owner=$GITHUB_USER \
  --repository=$(basename -s .git $(git config --get remote.origin.url)) \
  --branch=main \
  --path=./flux/cluster \
  --personal \
  --kubeconfig ${KUBECONFIG}
"""

[tasks."flux:age-setup"]
description = "Creates age key file; Creates cluster secret with created age file; Stores public age key in separate file; You should manually remove age file"
run = """
if [ -f "age_public_key" ]; then
    echo "Public key exists, setup has already been done"
    exit 1
fi

if [ -f "age.delete_me.agekey" ]; then
  echo "Skip private key generation"
else
  age-keygen -o age.delete_me.agekey
fi

age-keygen -y age.delete_me.agekey > age_public_key
cat age.delete_me.agekey |
kubectl --kubeconfig ${KUBECONFIG} create secret generic sops-age \
--namespace=flux-system \
--from-file=age.agekey=/dev/stdin \
--dry-run=client -o yaml | kubectl --kubeconfig ${KUBECONFIG} apply -f -
"""

# ============  Age  =============

[tasks."age:encrypt"]
description = "Encrypts secret via sops and age public key"
usage = '''
flag "--file <file>" help="File to encrypt"
'''
run = """
sops --age=$(cat age_public_key) \
--encrypt --encrypted-regex '^(data|stringData)$' --in-place ${usage_file}
"""

# ========= Debug ============
[tasks."debug:pvc"]
description = "Mount a PVC in an interactive busybox pod for inspection"
usage = '''
flag "--claim-name <claim_name>" help="PVC to debug"
'''
run = """
kubectl run debug-pvc --rm -it --restart=Never --image=busybox --overrides="$(cat <<EOF
{
  "spec": {
    "containers": [
      {
        "name": "debug-pvc",
        "image": "busybox",
        "command": ["sh"],
        "stdin": true,
        "tty": true,
        "volumeMounts": [{ "mountPath": "/pvc-mount", "name": "target-pvc-volume" }]
      }
    ],
    "volumes": [
      { "name": "target-pvc-volume", "persistentVolumeClaim": { "claimName": "${usage_claim_name:?}" } }
    ]
  }
}
EOF
)"
"""

[tasks."debug:postgres"]
description = "Attaches to postgres host"
run = """
kubectl run debug-pq --rm -it --restart=Never --namespace=default --image=postgres:alpine --overrides="$(cat <<EOF
{
  "spec": {
    "containers": [
      {
        "name": "debug-pq",
        "image": "postgres:alpine",
        "command": ["psql", "-h", "postgres", "-U", "postgres"],
        "stdin": true,
        "tty": true,
        "env": [
          {
            "name": "PGPASSWORD",
            "valueFrom": {
              "secretKeyRef": {
                "name": "postgres-auth",
                "key": "admin-password"
              }
            }
          }
        ]
      }
    ]
  }
}
EOF
)"
"""
