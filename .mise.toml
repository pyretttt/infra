[tools]
age = "latest"
flux2 = "latest"
helm = "latest"
k9s = "latest"
opentofu = "latest"
sops = "latest"
terraform = "latest"
# additionally openssl

[env]
KUBECONFIG = "tf/.kube.config"

[tasks."oci-provision"]
description = "creates oci k8s free infrastructure"
dir = "tf"
run = """
if [ -d ".terraform" ]; then
    echo "Terraform is initialized."
else
    echo "Terraform is NOT initialized. Running init now..."
    terraform init
fi
if [ -f "variables-private.auto.tfvars" ]; then
    echo "Private variables files found"
else
    echo "Setup variables-private.auto.tfvars"
    exit 1
fi
terraform apply
"""

[tasks."k9s"]
description = "runs k9s with provisioned cluster config"
run = """
if [ -f "${KUBECONFIG}" ]; then
    k9s --kubeconfig ${KUBECONFIG}
else
    echo "${KUBECONFIG} file does not exist"
    exit 1
fi
"""

[tasks."generate-kube-config"]
description = "Regenerated kube.config file"
dir = "tf"
run = """
terraform apply -replace=null_resource.kube_config
"""

[tasks."generate-wg-keys"]
description = "Generate wireguard client and server key pairs"
run = """
OPENSSL=$(brew --prefix openssl)/bin/openssl
gen_wg_keypair() {
  pem=$("$OPENSSL" genpkey -algorithm X25519)
  priv=$(printf '%s\n' "$pem" | "$OPENSSL" pkey -outform DER | tail -c 32 | base64)
  pub=$(printf '%s\n' "$pem" | "$OPENSSL" pkey -pubout -outform DER | tail -c 32 | base64)
  printf '%s %s\n' "$priv" "$pub"
}
set -- $(gen_wg_keypair)
SERVER_PRIV=$1
SERVER_PUB=$2
set -- $(gen_wg_keypair)
CLIENT_PRIV=$1
CLIENT_PUB=$2
printf 'SERVER_PRIV=%s\nSERVER_PUB=%s\nCLIENT_PRIV=%s\nCLIENT_PUB=%s\n' \
  "$SERVER_PRIV" "$SERVER_PUB" "$CLIENT_PRIV" "$CLIENT_PUB" > .wg-keys.env
"""

# ============  Template Rendering  =============

[tasks."render:wg-config"]
description = "Renders wireguard configs"
run = """
if [ -f manifests/wg/wg-config.yaml ] && [ -f wg-client.yaml ]; then
    echo Wireguard Already configured - skip setup
    exit 0
fi

if [ -f "tf/.kube.config" ]; then
    echo "Kubeconfig found"
else
    echo "Kubeconfig not found"
    exit 1
fi

mise run generate-wg-keys
set -a && source .wg-keys.env && set +a

sed -e 's|${SERVER_PRIV}|'"${SERVER_PRIV}"'|g' \
    -e 's|${CLIENT_PUB}|'"${CLIENT_PUB}"'|g' \
  manifests/wg/wg-config.yaml.tmpl > manifests/wg/wg-config.yaml

mise run age:encrypt --file manifests/wg/wg-config.yaml

INTERNAL_DNS_IP=$(kubectl --kubeconfig ${KUBECONFIG} get svc internal-coredns -n internal-dns -o jsonpath='{.spec.clusterIPs[0]}')
GATEWAY_IP=$(terraform -chdir=tf output -raw load_balancer_public_ip)

sed -e 's|${CLIENT_PRIV}|'"${CLIENT_PRIV}"'|g' \
    -e 's|${SERVER_PUB}|'"${SERVER_PUB}"'|g' \
    -e 's|${INTERNAL_DNS_IP}|'"${INTERNAL_DNS_IP}"'|g' \
    -e 's|${GATEWAY_IP}|'"${GATEWAY_IP}"'|g' \
  wg-client.yaml.tmpl > wg-client.yaml

mise run age:encrypt --file wg-client.yaml

rm -f .wg-keys.env
"""


[tasks."render:public-ingress"]
description = "Renders public ingress with NLB IP"
run = """
NLB_IP=$(terraform -chdir=tf output load_balancer_public_ip)

sed -e 's|${NLB_IP}|'"${NLB_IP}"'|g' \
  manifests/ingress/public-ingress.yaml.tmpl > manifests/ingress/public-ingress.yaml
"""

[tasks."render:all"]
description = "Renders all templates"
run = [
    { task = "render:public-ingress" },
    { task = "render:wg-config" }
]

# ============  Flux  =============

[tasks."flux:bootstrap"]
env.GITHUB_TOKEN = { required = "Github token required for fluxcd setup" }
env.GITHUB_USER  = { required = "Github username required for fluxcd setup" }
description = "Fluxcd configuration to reconcil this repo definitions from provisioned cluster"
run = """
flux bootstrap github \
  --owner=$GITHUB_USER \
  --repository=$(basename -s .git $(git config --get remote.origin.url)) \
  --branch=main \
  --path=./flux/cluster \
  --personal \
  --kubeconfig ${KUBECONFIG}
"""

[tasks."flux:age-setup"]
description = "Creates age key file; Creates cluster secret with created age file; Stores public age key in separate file; You should manually remove age file"
run = """
if [ -f "age_public_key" ]; then
    echo "Public key exists, setup has already been done"
    exit 1
fi

if [ -f "age.delete_me.agekey" ]; then
  echo "Skip private key generation"
else
  age-keygen -o age.delete_me.agekey
fi

age-keygen -y age.delete_me.agekey > age_public_key
cat age.delete_me.agekey |
kubectl --kubeconfig ${KUBECONFIG} create secret generic sops-age \
--namespace=flux-system \
--from-file=age.agekey=/dev/stdin \
--dry-run=client -o yaml | kubectl --kubeconfig ${KUBECONFIG} apply -f -
"""

# ============  Age  =============

[tasks."age:encrypt"]
description = "Encrypts secret via sops and age public key"
usage = '''
flag "--file <file>" help="File to encrypt"
'''
run = """
sops --age=$(cat age_public_key) \
--encrypt --encrypted-regex '^(data|stringData)$' --in-place ${usage_file}
"""