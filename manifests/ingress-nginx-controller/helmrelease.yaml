apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: default
spec:
  interval: 2h
  chart:
    spec:
      chart: ingress-nginx
      version: "4.13.3"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
      interval: 2h
  values:
    controller:
      # Public exposure is via Terraform NLB → NodePort Service (nlb-nodeport).
      service:
        enabled: false
      publishService:
        enabled: false
      ingressClassResource:
        name: nginx
        enabled: true
        default: true
      admissionWebhooks:
        enabled: true
      labels:
        ingress-tier: public
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 200m
          memory: 256Mi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx-internal
  namespace: default
spec:
  interval: 2h
  chart:
    spec:
      chart: ingress-nginx
      version: "4.13.3"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
  values:
    controller:
      electionID: ingress-nginx-internal-leader
      ingressClassResource:
        name: nginx-internal
        enabled: true
        default: false
        controllerValue: k8s.io/ingress-nginx-internal
      ingressClass: nginx-internal
      # WireGuard clients resolve Ingress hosts (grafana/prometheus/…) to this
      # ClusterIP; nginx then routes by Host. CoreDNS only indexes Services.
      service:
        enabled: true
        type: ClusterIP
        labels:
          internal-dns: enabled
      publishService:
        enabled: false
      # Public controller owns the cluster validating webhook; keep this one off.
      admissionWebhooks:
        enabled: false
      labels:
        ingress-tier: internal
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 200m
          memory: 256Mi
