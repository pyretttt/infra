apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: default
spec:
  interval: 2h
  chart:
    spec:
      chart: ingress-nginx
      version: "4.13.3"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
      interval: 2h
  values:
    controller:
      # Public exposure is via Terraform NLB → NodePort Service (nlb-nodeport).
      service:
        enabled: false
      publishService:
        enabled: false
      ingressClassResource:
        name: nginx
        enabled: true
        default: true
      admissionWebhooks:
        enabled: true
