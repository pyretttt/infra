apiVersion: v1
kind: ConfigMap
metadata:
  name: pod-restarts-dashboard
  namespace: default
  labels:
    grafana_dashboard: "1"
data:
  pod-restarts.json: |
    {
      "uid": "pod-restarts-10m",
      "title": "Pod restarts (10m)",
      "tags": ["kubernetes", "restarts"],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "label": "Data source",
            "current": { "text": "default", "value": "default" },
            "hide": 0,
            "regex": ""
          },
          {
            "name": "namespace",
            "type": "query",
            "label": "namespace",
            "datasource": { "type": "prometheus", "uid": "${datasource}" },
            "query": "label_values(namespace_pod_container:restarts:increase10m, namespace)",
            "refresh": 2,
            "sort": 1,
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "current": { "text": "All", "value": "$__all" }
          },
          {
            "name": "pod",
            "type": "query",
            "label": "pod",
            "datasource": { "type": "prometheus", "uid": "${datasource}" },
            "query": "label_values(namespace_pod_container:restarts:increase10m{namespace=~\"$namespace\"}, pod)",
            "refresh": 2,
            "sort": 1,
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "current": { "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Restarts (trailing 10m)",
          "gridPos": { "h": 5, "w": 8, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(namespace_pod_container:restarts:increase10m{namespace=~\"$namespace\", pod=~\"$pod\"})",
              "instant": true,
              "legendFormat": "__auto"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 1,
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 3 }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "textMode": "auto"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Containers with restarts",
          "gridPos": { "h": 5, "w": 8, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "expr": "count(namespace_pod_container:restarts:increase10m{namespace=~\"$namespace\", pod=~\"$pod\"} > 0) or vector(0)",
              "instant": true,
              "legendFormat": "__auto"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 3 }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "textMode": "auto"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Worst container",
          "gridPos": { "h": 5, "w": 8, "x": 16, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "expr": "max(namespace_pod_container:restarts:increase10m{namespace=~\"$namespace\", pod=~\"$pod\"})",
              "instant": true,
              "legendFormat": "__auto"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 1,
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 3 }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "textMode": "auto"
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Restarts per container (trailing 10m)",
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "expr": "namespace_pod_container:restarts:increase10m{namespace=~\"$namespace\", pod=~\"$pod\"} > 0",
              "legendFormat": "{{namespace}}/{{pod}}/{{container}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": true,
                "thresholdsStyle": { "mode": "line" }
              },
              "decimals": 1,
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 3 }
                ]
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "calcs": ["lastNotNull", "max"]
            },
            "tooltip": { "mode": "multi", "sort": "desc" }
          }
        },
        {
          "id": 5,
          "type": "table",
          "title": "Current restarts",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 17 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "expr": "namespace_pod_container:restarts:increase10m{namespace=~\"$namespace\", pod=~\"$pod\"} > 0",
              "format": "table",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": { "align": "auto" },
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 3 }
                ]
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Value" },
                "properties": [
                  { "id": "displayName", "value": "restarts / 10m" },
                  { "id": "custom.cellOptions", "value": { "type": "color-background" } }
                ]
              }
            ]
          },
          "options": { "showHeader": true, "sortBy": [{ "displayName": "Value", "desc": true }] },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true, "__name__": true },
                "indexByName": {
                  "namespace": 0,
                  "pod": 1,
                  "container": 2,
                  "Value": 3
                }
              }
            }
          ]
        }
      ]
    }
