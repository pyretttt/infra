apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 2h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "88.2.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 2h
  releaseName: kube-prometheus-stack
  # PVCs main-ad1/main-ad2 live in default — claim must be same namespace as pods.
  targetNamespace: default
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  timeout: 10m
  values:
    defaultRules:
      create: true
      rules:
        etcd: false
        kubeControllerManager: false
        kubeProxy: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false

    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false

    # Node exporter — remaining CPU/RAM
    prometheus-node-exporter:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 50m
          memory: 64Mi

    # Alertmanager: keep on; data is small — ephemeral.
    alertmanager:
      enabled: true
      ingress:
        enabled: true
        ingressClassName: nginx-internal
        hosts:
          - alertmanager.polywhale.com
        paths:
          - /
        pathType: Prefix
      # Required for internal-dns
      service:
        nameOverride: "alertmanager"
        labels:
          internal-dns: enabled
      alertmanagerSpec:
        replicas: 1
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            cpu: 100m
            memory: 128Mi

    # --- Grafana (in-chart) ---
    grafana:
      enabled: true
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      nodeSelector:
        name: k8s-cluster-pool-0
      persistence:
        enabled: true
        type: pvc
        existingClaim: main-ad1
        subPath: grafana
      # Required for internal-dns
      service:
        nameOverride: "grafana"
        labels:
          internal-dns: enabled
      ingress:
        enabled: true
        ingressClassName: nginx-internal
        hosts:
          - grafana.polywhale.com
        path: /
        pathType: Prefix
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 200m
          memory: 256Mi
      # Phase 2: plugins: [oci-metrics-datasource]

    # --- Prometheus ---
    prometheus:
      # Required for internal-dns
      service:
        nameOverride: "prometheus"
        labels:
          internal-dns: enabled
      ingress:
        enabled: true
        ingressClassName: nginx-internal
        hosts:
          - prometheus.polywhale.com
        paths:
          - /
        pathType: Prefix
      prometheusSpec:
        replicas: 1
        retention: 24h
        retentionSize: 20GB
        scrapeInterval: 30s
        evaluationInterval: 30s
        nodeSelector:
          name: k8s-cluster-pool-0
        # Leave storageSpec unset/empty so operator does not create a PVC.
        # Mount existing claim at a path other than the default emptyDir /prometheus.
        additionalArgs:
          - name: storage.tsdb.path
            value: /data
        volumes:
          - name: prometheus-data
            persistentVolumeClaim:
              claimName: main-ad1
        volumeMounts:
          - name: prometheus-data
            mountPath: /data
            subPath: prometheus
        resources:
          requests:
            cpu: 100m
            memory: 1280Mi
          limits:
            cpu: 500m
            memory: 1280Mi

    prometheusOperator:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 150m
          memory: 128Mi

    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 128Mi
