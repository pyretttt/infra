apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 2h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "88.2.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 2h
  releaseName: kube-prometheus-stack
  targetNamespace: default
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  timeout: 10m
  values:
    defaultRules:
      create: true
      rules:
        etcd: false
        kubeControllerManager: false
        kubeProxy: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false

    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false

    # Node exporter — remaining CPU/RAM
    prometheus-node-exporter:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 50m
          memory: 64Mi

    # Alertmanager: keep on; data is small — ephemeral.
    alertmanager:
      enabled: true
      ingress:
        enabled: true
        ingressClassName: nginx-internal
        hosts:
          - alertmanager.polywhale.com
        paths:
          - /
        pathType: Prefix
      alertmanagerSpec:
        replicas: 1
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            cpu: 100m
            memory: 128Mi

    # --- Grafana (in-chart) ---
    grafana:
      enabled: true
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      # Recreate: RWO local-path cannot attach to two pods during RollingUpdate.
      deploymentStrategy:
        type: Recreate
      persistence:
        enabled: true
        type: pvc
        storageClassName: local-path
        accessModes:
          - ReadWriteOnce
        size: 5Gi
        # Keep the PVC if the HelmRelease is removed; pod restarts never delete it.
        annotations:
          helm.sh/resource-policy: keep
      ingress:
        enabled: true
        ingressClassName: nginx-internal
        hosts:
          - grafana.polywhale.com
        path: /
        pathType: Prefix
      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 512Mi
      sidecar:
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            cpu: 100m
            memory: 128Mi
      # Phase 2: plugins: [oci-metrics-datasource]

    # --- Prometheus ---
    prometheus:
      ingress:
        enabled: true
        ingressClassName: nginx-internal
        hosts:
          - prometheus.polywhale.com
        paths:
          - /
        pathType: Prefix
      prometheusSpec:
        replicas: 1
        retention: 48h
        # Must stay below the PVC request; local-path does not enforce quota.
        retentionSize: 4GB
        scrapeInterval: 30s
        evaluationInterval: 30s
        # StatefulSet default is Retain; set explicitly so scale/delete keep the claim.
        persistentVolumeClaimRetentionPolicy:
          whenDeleted: Retain
          whenScaled: Retain
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 5Gi
        resources:
          requests:
            cpu: 50m
            memory: 1280Mi
          limits:
            cpu: 500m
            memory: 1280Mi

    prometheusOperator:
      resources:
        requests:
          cpu: 20m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 128Mi
      # Shared by Prometheus + Alertmanager config-reloader sidecars.
      prometheusConfigReloader:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 50m
            memory: 64Mi

    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 128Mi
