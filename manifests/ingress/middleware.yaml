apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-one
  namespace: default
spec:
  stripPrefix:
    prefixes:
      - /one
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-two
  namespace: default
spec:
  stripPrefix:
    prefixes:
      - /two
---
# Same prefixes for the internal controller (CRD provider filters on IngressClass).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-one-internal
  namespace: default
  annotations:
    kubernetes.io/ingress.class: traefik-internal
spec:
  stripPrefix:
    prefixes:
      - /one
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-two-internal
  namespace: default
  annotations:
    kubernetes.io/ingress.class: traefik-internal
spec:
  stripPrefix:
    prefixes:
      - /two
