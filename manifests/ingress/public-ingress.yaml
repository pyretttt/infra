apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-gateway
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-staging
    external-dns.alpha.kubernetes.io/target: "139.185.35.4"
spec:
  ingressClassName: nginx
  rules:
    - http:
        host: polywhale.com
        paths:
        - path: /one
          pathType: Prefix
          backend:
            service:
              name: static-nginx-service-1
              port:
                number: 80
    - http:
        host: polywhale.com
        paths:
        - path: /two
          pathType: Prefix
          backend:
            service:
              name: static-nginx-service-2
              port:
                number: 80