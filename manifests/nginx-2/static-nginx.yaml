apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-static-config-2
  namespace: default
data:
  default.conf: |
    server {
        listen 80;
        location / {
            return 200 'Hello, this is static text from Nginx #2!';
            add_header Content-Type text/plain;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: static-nginx-deployment-2
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: static-nginx-2
  template:
    metadata:
      labels:
        app: static-nginx-2
    spec:
      containers:
      - name: nginx
        image: docker.io/library/nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config-volume
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
      volumes:
      - name: config-volume
        configMap:
          name: nginx-static-config-2
---
apiVersion: v1
kind: Service
metadata:
  name: static-nginx-service-2
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: static-nginx-2
  ports:
  - port: 80
    targetPort: 80
