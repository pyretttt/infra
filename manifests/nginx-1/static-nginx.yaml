apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-static-config-1
  namespace: default
data:
  default.conf: |
    server {
        listen 80;
        location / {
            default_type text/html;
            return 200 '<!DOCTYPE html><html><body><p>Hello, Evgeny!</p></body></html>';
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: static-nginx-deployment-1
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: static-nginx-1
  template:
    metadata:
      labels:
        app: static-nginx-1
    spec:
      containers:
      - name: nginx
        image: docker.io/library/nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - name: config-volume
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
      volumes:
      - name: config-volume
        configMap:
          name: nginx-static-config-1
---
apiVersion: v1
kind: Service
metadata:
  name: static-nginx-service-1
  namespace: default
  labels:
    internal-dns: enabled
spec:
  type: ClusterIP
  selector:
    app: static-nginx-1
  ports:
  - port: 80
    targetPort: 80
