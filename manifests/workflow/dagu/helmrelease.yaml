apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dagu
  namespace: flux-system
spec:
  interval: 2h
  targetNamespace: default
  chart:
    spec:
      chart: dagu
      version: "2.0.0"
      sourceRef:
        kind: HelmRepository
        name: dagu
        namespace: flux-system
      interval: 2h
  values:
    deploymentMode: standalone
    nodeSelector:
      name: k8s-cluster-pool-1
    config:
      publicUrl: "http://dagu.polywhale.com"
    ui:
      replicas: 1
      resources:
        requests:
          memory: "512Mi"
          cpu: "50m"
        limits:
          memory: "512Mi"
          cpu: "500m"
    ingress:
      enabled: true
      className: "nginx-internal"
      host: dagu.polywhale.com
      tls:
        enabled: false
    auth:
      mode: basic
      basic:
        existingSecret: dagu-basic-auth
        usernameKey: username
        passwordKey: password
    persistence:
      existingClaim: main-ad2
