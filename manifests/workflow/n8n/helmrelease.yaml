apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
  namespace: flux-system
spec:
  interval: 2h
  # PVC main-ad2 lives in default — claim must be same namespace as pods.
  targetNamespace: default
  chart:
    spec:
      chart: n8n
      version: "2.0.1"
      sourceRef:
        kind: HelmRepository
        name: n8n
        namespace: flux-system
      interval: 2h
  values:
    image:
      tag: "2.33.7"

    ingress:
      enabled: true
      className: "nginx-internal"
      hosts:
        - host: n8n.polywhale.com
          paths:
            - path: /
              pathType: Prefix
      tls: []

    # Queue/worker mode needs Valkey/Redis — keep off for sqlite single-process.
    # worker:
    #   enabled: true
    # webhook:
    #   enabled: true
    # valkey:
    #   enabled: true

    main:
      nodeSelector:
        name: k8s-cluster-pool-1

      config:
        db:
          type: sqlite
        n8n:
          hide_usage_page: true
          # Required behind reverse proxy — pick host to match ingress above.
          host: n8n.polywhale.com
          protocol: http
          port: 80
          editor_base_url: http://n8n.polywhale.com/
        generic:
          timezone: Europe/Moscow

      # Prefer external Secret (see n8n-secret.yaml.tmpl) over chart-managed values in git.
      extraEnv:
        N8N_ENCRYPTION_KEY:
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: encryption-key
        # WEBHOOK_URL:
        #   value: "http://n8n.polywhale.com/"

      persistence:
        enabled: true
        type: existing
        existingClaim: main-ad2

      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          cpu: 500m
          # Options: 768Mi if tighter; avoid ≥2Gi on this node.
          memory: 2048Mi

      service:
        type: ClusterIP
        port: 80

      deploymentStrategy:
        type: Recreate
