apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
  namespace: flux-system
spec:
  interval: 2h
  timeout: 10m
  install:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  targetNamespace: default
  chart:
    spec:
      chart: n8n
      version: "2.0.1"
      sourceRef:
        kind: HelmRepository
        name: n8n
        namespace: flux-system
      interval: 2h
  values:
    image:
      # CRI-O short-name mode requires a fully-qualified registry.
      repository: docker.io/n8nio/n8n
      tag: "2.33.7"

    ingress:
      enabled: true
      className: "traefik-internal"
      hosts:
        - host: n8n.polywhale.com
          paths:
            - path: /
              pathType: Prefix
      tls: []

    # Queue/worker mode needs Valkey/Redis — keep off for sqlite single-process.
    # worker:
    #   enabled: true
    # webhook:
    #   enabled: true
    # valkey:
    #   enabled: true

    main:
      # Chart expects a map (env name → EnvVar fields), not a list.
      extraEnv:
        N8N_ENCRYPTION_KEY:
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: encryption-key
        # n8n 1.97+ listens on :: by default; kubelet probes the IPv4 pod IP.
        N8N_LISTEN_ADDRESS:
          value: "0.0.0.0"

      # Chart 2.0.1 has no startupProbe. Default liveness (no delay, 3x10s)
      # SIGTERMs n8n before sqlite + vacuum bind :5678 (~30s, exit 143).
      livenessProbe:
        httpGet:
          path: /healthz
          port: http
        initialDelaySeconds: 90
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 12
      readinessProbe:
        httpGet:
          path: /healthz
          port: http
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 12

      config:
        db:
          type: sqlite
          sqlite:
            # Vacuum on every start plus default liveness (~30s) caused CrashLoopBackOff.
            vacuum_on_startup: false
        executions:
          data:
            prune: true
            max_age: 168
        n8n:
          hide_usage_page: true
          # Public URL bits for reverse proxy. Do NOT set port: 80 — that is
          # N8N_PORT (listen port); chart maps it to containerPort, and
          # non-root cannot bind <1024. Service port 80 → targetPort 5678.
          host: n8n.polywhale.com
          protocol: http
          editor_base_url: http://n8n.polywhale.com/
          secure_cookie: false
        generic:
          timezone: Europe/Moscow

      persistence:
        enabled: true
        type: dynamic
        storageClass: local-path
        accessModes:
          - ReadWriteOnce
        size: 10Gi
        # Keep the PVC if the HelmRelease is removed; pod restarts never delete it.
        annotations:
          helm.sh/resource-policy: keep

      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          cpu: 500m
          # Options: 768Mi if tighter; avoid ≥2Gi on this node.
          memory: 2048Mi

      service:
        type: ClusterIP
        port: 80

      deploymentStrategy:
        type: Recreate
