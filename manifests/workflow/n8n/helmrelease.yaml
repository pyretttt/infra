apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
  namespace: flux-system
spec:
  interval: 2h
  timeout: 10m
  install:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  targetNamespace: default
  chart:
    spec:
      chart: n8n
      version: "2.0.1"
      sourceRef:
        kind: HelmRepository
        name: n8n
        namespace: flux-system
      interval: 2h
  values:
    image:
      # CRI-O short-name mode requires a fully-qualified registry.
      repository: docker.io/n8nio/n8n
      tag: "2.33.7"

    ingress:
      enabled: true
      className: "traefik-internal"
      hosts:
        - host: n8n.polywhale.com
          paths:
            - path: /
              pathType: Prefix
      tls: []

    main:
      # Chart expects a map (env name → EnvVar fields), not a list.
      extraEnv:
        N8N_ENCRYPTION_KEY:
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: encryption-key
        # n8n 1.97+ listens on :: by default; kubelet probes the IPv4 pod IP.
        N8N_LISTEN_ADDRESS:
          value: "0.0.0.0"
        DB_POSTGRESDB_USER:
          value: postgres
        DB_POSTGRESDB_PASSWORD:
          valueFrom:
            secretKeyRef:
              name: postgres-auth
              key: admin-password
        N8N_INSTANCE_OWNER_MANAGED_BY_ENV:
          value: "true"
        N8N_INSTANCE_OWNER_EMAIL:
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: instance-owner-email
        N8N_INSTANCE_OWNER_FIRST_NAME:
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: instance-owner-first-name
        N8N_INSTANCE_OWNER_LAST_NAME:
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: instance-owner-last-name
        N8N_INSTANCE_OWNER_PASSWORD_HASH:
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: instance-owner-password-hash

      # Chart 2.0.1 has no startupProbe. Default liveness (no delay, 3x10s)
      # SIGTERMs n8n before sqlite + vacuum bind :5678 (~30s, exit 143).
      livenessProbe:
        httpGet:
          path: /healthz
          port: http
        initialDelaySeconds: 90
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 12
      readinessProbe:
        httpGet:
          path: /healthz
          port: http
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 12

      config:
        db:
          type: postgresdb
          ping:
            interval:
              seconds: 10

          postgresdb:
            host: postgres
            database: n8n
            port: 5432

        executions:
          data:
            prune: true
            max_age: 168
        n8n:
          hide_usage_page: true
          # Public URL bits for reverse proxy. Do NOT set port: 80 — that is
          # N8N_PORT (listen port); chart maps it to containerPort, and
          # non-root cannot bind <1024. Service port 80 → targetPort 5678.
          host: n8n.polywhale.com
          protocol: http
          editor_base_url: http://n8n.polywhale.com/
          secure_cookie: false
        generic:
          timezone: Europe/Moscow

      persistence:
        enabled: true
        type: dynamic
        storageClass: local-path
        accessModes:
          - ReadWriteOnce
        size: 10Gi
        # Keep the PVC if the HelmRelease is removed; pod restarts never delete it.
        annotations:
          helm.sh/resource-policy: keep

      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          # Options: 768Mi if tighter; avoid ≥2Gi on this node.
          memory: 2048Mi

      service:
        type: ClusterIP
        port: 80

      deploymentStrategy:
        type: Recreate
