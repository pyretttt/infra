apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: windmill
  namespace: flux-system
spec:
  interval: 2h
  timeout: 20m
  install:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  targetNamespace: default
  chart:
    spec:
      chart: windmill
      version: "4.0.240"
      sourceRef:
        kind: HelmRepository
        name: windmill
        namespace: flux-system
      interval: 2h
  values