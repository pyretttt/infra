apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: flux-system
spec:
  interval: 12h
  # Stays in default so the existing SOPS Secret (cloudflare-api-token) mounts without re-encrypt.
  # Move both to namespace external-dns later with: mise run age-encrypt manifests/external-dns/secret.yaml
  targetNamespace: default
  releaseName: external-dns
  chart:
    spec:
      chart: external-dns
      version: "1.21.1"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
      interval: 12h
  values:
    resources:
      requests:
        memory: 32Mi
        cpu: 10m
      limits:
        memory: 64Mi
        cpu: 50m
    provider:
      name: cloudflare
    policy: sync
    sources:
      - ingress
    managedRecordTypes:
      - A
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token
            key: api-token
    extraArgs:
