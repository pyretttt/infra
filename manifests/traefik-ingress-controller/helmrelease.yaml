apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-internal
  namespace: default
spec:
  interval: 2h
  chart:
    spec:
      chart: traefik
      version: "41.2.0"
      sourceRef:
        kind: HelmRepository
        name: traefik-controller
        namespace: flux-system
      interval: 2h
  # k3s already installed Traefik CRDs for the public controller.
  install:
    crds: Skip
  upgrade:
    crds: Skip
  values:
    # Distinct from k3s Traefik (IngressClass `traefik`, LoadBalancer on :80/:443).
    fullnameOverride: traefik-internal
    ingressClass:
      enabled: true
      isDefaultClass: false
      name: traefik-internal
    providers:
      kubernetesCRD:
        enabled: true
        ingressClass: traefik-internal
      kubernetesIngress:
        enabled: true
        ingressClass: traefik-internal
        publishedService:
          enabled: false
      kubernetesGateway:
        enabled: false
    gateway:
      enabled: false
    gatewayClass:
      enabled: false
    # WireGuard clients resolve Ingress hosts (grafana/prometheus/…) to this
    # ClusterIP; Traefik then routes by Host. CoreDNS only indexes Services.
    # ClusterIP — do not use LoadBalancer or k3s ServiceLB would bind :80/:443 twice.
    service:
      enabled: true
      spec:
        type: ClusterIP
      labels:
        internal-dns: enabled
    deployment:
      replicas: 1
      podLabels:
        ingress-tier: internal
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
