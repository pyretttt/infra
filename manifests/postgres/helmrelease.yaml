apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres
  namespace: flux-system
spec:
  interval: 2h
  timeout: 10m
  install:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  targetNamespace: default
  chart:
    spec:
      chart: postgresql
      version: "18.8.9"
      sourceRef:
        kind: HelmRepository
        name: postgresql
        namespace: flux-system
      interval: 2h
  # Same namespace as this HelmRelease (CRD has no valuesFrom.namespace).
  valuesFrom:
    - kind: ConfigMap
      name: postgres-user
      valuesKey: username
      targetPath: auth.username
      literal: true
  values:
    fullnameOverride: postgres

    image:
      registry: docker.io
      repository: bitnami/postgresql
      tag: latest

    auth:
      enablePostgresUser: true
      existingSecret: postgres-auth
      secretKeys:
        adminPasswordKey: admin-password
        userPasswordKey: postgres-password

    architecture: standalone

    primary:
      # .sql is executed by Bitnami with the app role password. A .sh that calls
      # psql does not get PGPASSWORD and fails on md5 local auth.
      initdb:
        scripts:
          01-create-n8n.sql: |
            SELECT 'CREATE DATABASE n8n'
            WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'n8n')\gexec
      persistence:
        enabled: true
        storageClass: local-path
        accessModes:
          - ReadWriteOnce
        size: 10Gi
        # Keep the PVC if the HelmRelease is removed; pod restarts never delete it.
        annotations:
          helm.sh/resource-policy: keep
      persistentVolumeClaimRetentionPolicy:
        enabled: true
        whenDeleted: Retain
        whenScaled: Retain
      resources:
        requests:
          cpu: 50m
          memory: 768Mi
        limits:
          cpu: 500m
          memory: 768Mi
