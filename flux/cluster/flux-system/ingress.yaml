apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ingress
  namespace: flux-system
spec:
  interval: 1m
  path: ./manifests/ingress
  prune: true
  # ingress-nginx is a HelmRelease under the apps Kustomization (healthChecked there),
  # not a Flux Kustomization — depending on it by name blocks reconcile forever.
  dependsOn:
    - name: apps
  sourceRef:
    kind: GitRepository
    name: flux-system
