apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
- manifests.yaml
- cert-issuers.yaml
- ingress.yaml
- postgres.yaml
- windmill.yaml
# Always Free: default Flux requests (50–100m × 4) crowd node request budgets.
# Patch here (not gotk-components.yaml) so flux bootstrap upgrades keep the tweak.
patches:
  - target:
      kind: Deployment
      name: "(source-controller|kustomize-controller|helm-controller|notification-controller)"
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 512Mi
